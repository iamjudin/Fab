<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Уход за растениями · прототип</title>
<style>
*{box-sizing:border-box}body{font:17px system-ui;margin:0;color:#18251c;background:#f5f6f5}main{max-width:640px;margin:auto;padding:20px}button,input,textarea{font:inherit}button{padding:10px 14px;cursor:pointer}button:disabled{cursor:wait}article{background:white;border:1px solid #bbb;padding:16px;margin:12px 0}h1,h2,p,li{overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:16px 0}input,textarea{display:block;width:100%;padding:10px}dialog{width:min(94vw,600px);max-height:90vh;overflow:auto;border:1px solid #777;padding:24px;border-radius:8px}dialog::backdrop{background:#0006}#message,.error{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#a01818}aside{font-size:13px;border-top:1px solid #aaa;margin-top:28px;padding-top:10px}aside button{font-size:13px;padding:5px}li{margin:14px 0}small{display:block}
</style>
<main><section id="screen"></section><p id="message" role="status" aria-live="polite"></p><aside aria-label="Тестовые controls">Тест сохранения: <button type="button" id="fail">Ошибка следующего сохранения</button><span id="armed" role="status"></span></aside></main>
<dialog id="sheet"><form id="form"><h2 id="formTitle"></h2><label>Название<input id="name" name="name" required></label><label>Напоминание (необязательно)<textarea id="reminder" name="reminder" rows="3"></textarea></label><small>Свободный текст. Уведомления не отправляются.</small><p id="formError" class="error" role="alert"></p><div class="actions"><button id="submit" type="submit">Создать</button><button id="cancel" type="button">Отмена</button></div></form></dialog>
<script src="app.js"></script></html>
