<text x="41" y="77" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Поездки</text>
<text x="41" y="102" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Пусто: создай поездку</text>
<rect x="55" y="280" width="370" height="70" rx="12" fill="#b6bcc3" stroke="#59616d" stroke-width="3"/>
<text x="71" y="312" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Название поездки</text>
<text x="71" y="337" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Собрано X из Y</text>
<rect x="55" y="380" width="370" height="65" rx="12" fill="#2563eb" stroke="#59616d" stroke-width="3"/>
<text x="71" y="412" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Открыть эту поездку → S-02</text>
<rect x="25" y="570" width="430" height="65" rx="12" fill="#2563eb" stroke="#59616d" stroke-width="3"/>
<text x="41" y="602" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Новая поездка → S-03</text>
<rect x="25" y="700" width="430" height="110" rx="12" fill="#b6bcc3" stroke="#59616d" stroke-width="3"/>
<text x="41" y="732" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Ошибка чтения: сообщение;</text>
<text x="41" y="757" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">данные не перезаписываются.</text>
<text x="41" y="782" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Подробности — interface.md</text>
<rect x="785" y="45" width="430" height="60" rx="12" fill="#2563eb" stroke="#59616d" stroke-width="3"/>
<text x="801" y="77" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Назад → S-01</text>
<rect x="785" y="125" width="430" height="80" rx="12" fill="#b6bcc3" stroke="#59616d" stroke-width="3"/>
<text x="801" y="157" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Полное название поездки</text>
<text x="801" y="182" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Собрано X из Y (все вещи)</text>
<rect x="785" y="215" width="430" height="60" rx="12" fill="#bae6fd" stroke="#59616d" stroke-width="3"/>
<text x="801" y="247" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Все / Осталось · текущая поездка</text>
<rect x="815" y="425" width="370" height="60" rx="12" fill="#b6bcc3" stroke="#59616d" stroke-width="3"/>
<text x="831" y="457" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Название вещи · packed</text>
<rect x="815" y="510" width="370" height="60" rx="12" fill="#16a34a" stroke="#59616d" stroke-width="3"/>
<text x="831" y="542" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Отметить / вернуть эту вещь</text>
<rect x="815" y="595" width="370" height="60" rx="12" fill="#2563eb" stroke="#59616d" stroke-width="3"/>
<text x="831" y="627" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Править эту вещь → S-03</text>
<rect x="785" y="750" width="430" height="60" rx="12" fill="#2563eb" stroke="#59616d" stroke-width="3"/>
<text x="801" y="782" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Добавить вещь → S-03</text>
<rect x="785" y="835" width="430" height="120" rx="12" fill="#b6bcc3" stroke="#59616d" stroke-width="3"/>
<text x="801" y="867" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Пустая поездка ≠ всё собрано.</text>
<text x="801" y="892" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Ошибка отметки: прежний статус</text>
<text x="801" y="917" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">и сообщение. Возврат через «Все».</text>
<rect x="1545" y="45" width="430" height="110" rx="12" fill="#b6bcc3" stroke="#59616d" stroke-width="3"/>
<text x="1561" y="77" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Новая поездка / добавить вещь /</text>
<text x="1561" y="102" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">править вещь. Контекст: Trip.id,</text>
<text x="1561" y="127" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">при правке — также Item.id.</text>
<rect x="1545" y="190" width="430" height="90" rx="12" fill="#bae6fd" stroke="#59616d" stroke-width="3"/>
<text x="1561" y="222" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Название · поле с label</text>
<text x="1561" y="247" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Черновик; правка: исходное имя</text>
<rect x="1545" y="300" width="430" height="95" rx="12" fill="#b6bcc3" stroke="#59616d" stroke-width="3"/>
<text x="1561" y="332" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Пустое имя / ошибка записи:</text>
<text x="1561" y="357" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">сообщение у поля; ввод остаётся.</text>
<text x="1561" y="382" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Повтор — той же кнопкой записи.</text>
<rect x="1545" y="440" width="430" height="100" rx="12" fill="#16a34a" stroke="#59616d" stroke-width="3"/>
<text x="1561" y="472" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Создать / Добавить / Сохранить</text>
<text x="1561" y="497" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Успешная запись → S-02</text>
<text x="1561" y="522" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Ошибка: остаёмся в S-03</text>
<rect x="1545" y="620" width="430" height="100" rx="12" fill="#2563eb" stroke="#59616d" stroke-width="3"/>
<text x="1561" y="652" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Отмена / Escape → источник</text>
<text x="1561" y="677" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Новая поездка: S-01</text>
<text x="1561" y="702" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Вещь: та же S-02</text>
<rect x="1545" y="790" width="430" height="135" rx="12" fill="#b6bcc3" stroke="#59616d" stroke-width="3"/>
<text x="1561" y="822" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Отмена удаляет только черновик.</text>
<text x="1561" y="847" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Клик снаружи не закрывает.</text>
<text x="1561" y="872" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">После записи вещи — та же поездка</text>
<text x="1561" y="897" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">и фильтр; новая поездка — «Все».</text>
<rect x="0" y="1100" width="850" height="120" rx="12" fill="#b6bcc3" stroke="#59616d" stroke-width="3"/>
<text x="16" y="1132" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Карта структуры · кандидат · model.md → interface.md</text>
<text x="16" y="1157" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Серый: информация; голубой: локальный ввод/фильтр;</text>
<text x="16" y="1182" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">синий: навигация; зелёный: запрос изменения данных.</text>
<text x="16" y="1207" font-size="21" font-family="Arial, sans-serif" fill="#1d2227">Вложенные группы — владельцы, стрелки — переходы.</text>
</svg>
