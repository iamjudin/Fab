name: Fab package and scope
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -B scripts/check_project.py
        env:
          FAB_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: python3 -B scripts/check_package.py
      - run: python3 -B -m unittest discover -s tests -q
      - run: python3 -B scripts/check_fab_release.py
